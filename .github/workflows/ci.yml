name: Monorepo CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
      has_changes: ${{ steps.generate.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed folders
        id: generate
        uses: actions/github-script@v7
        with:
          script: |
            const projects = [
              {
                id: 'java-service',
                path: 'services/java-service',
                language: 'java',
                runner: 'ubuntu-latest',
                cacheKey: 'maven'
              },
              {
                id: 'node-frontend',
                path: 'services/node-frontend',
                language: 'node',
                runner: 'ubuntu-latest',
                cacheKey: 'npm'
              },
              {
                id: 'python-utility',
                path: 'services/python-utility',
                language: 'python',
                runner: 'ubuntu-latest',
                cacheKey: 'pip'
              }
            ];

            const compare = process.env.GITHUB_EVENT_NAME === 'pull_request'
              ? `${context.payload.pull_request.base.sha}...${context.payload.pull_request.head.sha}`
              : `${context.payload.before}...${context.sha}`;

            if (!compare || compare.startsWith('0000000000000000000000000000000000000000')) {
              core.setOutput('matrix', JSON.stringify({ include: projects }));
              core.setOutput('has_changes', 'true');
              return;
            }

            const response = await github.rest.repos.compareCommitsWithBasehead({
              owner: context.repo.owner,
              repo: context.repo.repo,
              basehead: compare,
            });

            const changedFiles = response.data.files.map(file => file.filename);

            const affected = projects.filter(project =>
              changedFiles.some(file => file === project.path || file.startsWith(`${project.path}/`))
            );

            const matrix = affected;
            core.setOutput('matrix', JSON.stringify({ include: matrix }));
            core.setOutput('has_changes', String(affected.length > 0));

      - name: Job summary
        run: |
          echo '### Changed project detection' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Has affected folders: `${{ steps.generate.outputs.has_changes }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Matrix payload: `${{ steps.generate.outputs.matrix }}`' >> "$GITHUB_STEP_SUMMARY"

  ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    uses: ./.github/workflows/reusable-ci.yml
    with:
      project_id: ${{ matrix.id }}
      project_path: ${{ matrix.path }}
      project_language: ${{ matrix.language }}
      runs_on: ${{ matrix.runner }}
      cache_key: ${{ matrix.cacheKey }}
