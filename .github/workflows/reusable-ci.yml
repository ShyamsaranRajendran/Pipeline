name: Reusable Project CI

on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
      project_path:
        required: true
        type: string
      project_language:
        required: true
        type: string
      runs_on:
        required: true
        type: string
      cache_key:
        required: true
        type: string

jobs:
  lint-test-package:
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        if: inputs.project_language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Node.js
        if: inputs.project_language == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            ${{ inputs.project_path }}/package-lock.json

      - name: Setup Python
        if: inputs.project_language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ${{ inputs.project_path }}/pyproject.toml

      - name: Cache Python wheels
        if: inputs.project_language == 'python'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
          key: ${{ runner.os }}-${{ inputs.cache_key }}-${{ hashFiles(format('{0}/pyproject.toml', inputs.project_path)) }}

      - name: Run lint and tests
        id: run
        shell: bash
        working-directory: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          case "${{ inputs.project_language }}" in
            java)
              mvn -q -DskipTests compile
              mvn test
              mkdir -p target/coverage
              echo 'dummy-java-coverage' > target/coverage/coverage.txt
              ;;
            node)
              npm run lint
              npm test
              echo 'dummy-node-coverage' > coverage.txt
              ;;
            python)
              python -m pip install --upgrade pip
              python -m pip install -e .[dev]
              python -m compileall src tests
              python -m pytest --junitxml=junit.xml --cov=python_utility --cov-report=xml
              ;;
          esac

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_id }}-coverage
          path: |
            ${{ inputs.project_path }}/target/coverage
            ${{ inputs.project_path }}/coverage.xml
            ${{ inputs.project_path }}/coverage.txt
            ${{ inputs.project_path }}/junit.xml
          if-no-files-found: ignore

      - name: Package artifacts
        shell: bash
        working-directory: ${{ inputs.project_path }}
        run: |
          mkdir -p dist
          printf 'artifact for %s\n' '${{ inputs.project_id }}' > dist/build.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project_id }}-artifact
          path: ${{ inputs.project_path }}/dist

      - name: Job summary
        shell: bash
        run: |
          {
            echo '### ${{ inputs.project_id }} CI summary'
            echo ''
            echo '- Language: ${{ inputs.project_language }}'
            echo '- Path: ${{ inputs.project_path }}'
            echo '- Cache key: ${{ inputs.cache_key }}'
            echo '- Coverage artifact: `${{ inputs.project_id }}-coverage`'
            echo '- Build artifact: `${{ inputs.project_id }}-artifact`'
          } >> "$GITHUB_STEP_SUMMARY"
